name: Update README city

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - assets/scripts/**
      - .github/workflows/city.yml

permissions:
  contents: write

concurrency:
  group: city
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Refresh public contribution data and SVGs
        env:
          CITY_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node assets/scripts/city-grid.cjs --refresh --user "$CITY_USER" --style base --out assets/city
      - name: Save updated city
        run: |
          git add assets/city/dark.svg assets/city/light.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Refresh contribution city [skip ci]"
          git push
